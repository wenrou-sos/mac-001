<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mac-001 · KTV 包厢状态看板</title>
<style>
  :root {
    --bg: #0f1220; --panel: #181c2e; --panel2: #1f2440; --line: #2a3050;
    --text: #e8eaf6; --muted: #9aa0c3;
    --in-use: #ff7a59; --to-clean: #f5b942; --cleaning: #42a5f5;
    --inspecting: #ab7df7; --open: #37c978;
    --danger: #ff4d6d; --warn: #f5b942;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; white-space: nowrap; }
  .conn { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--open); }
  .dot.off { background: var(--danger); }
  .identity { display: flex; gap: 8px; margin-left: auto; align-items: center; flex-wrap: wrap; }
  select, input, button, textarea {
    font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
  }
  button { cursor: pointer; transition: filter .15s, transform .05s; }
  button:hover { filter: brightness(1.25); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: #3d5afe; border-color: #3d5afe; }
  button.danger { background: #b3261e; border-color: #b3261e; }
  button.ghost { background: transparent; }
  .layout { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }
  .alerts { margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
  .alert {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 10px;
    background: rgba(245,185,66,.12); border: 1px solid rgba(245,185,66,.4); font-size: 13px;
  }
  .alert.critical { background: rgba(255,77,109,.14); border-color: rgba(255,77,109,.5); }
  .alert .tag { font-weight: 700; }
  .alert .time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .alert.ack { background: rgba(66,165,245,.10); border-color: rgba(66,165,245,.45); }
  .alert .astatus { font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 700;
    background: rgba(245,185,66,.2); color: var(--warn); white-space: nowrap; }
  .alert.ack .astatus { background: rgba(66,165,245,.2); color: var(--cleaning); }
  .alert .note { width: 100%; color: #b8d8ff; }
  .alert .ackbtn { white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; border-left-width: 4px; display: flex; flex-direction: column; gap: 10px;
  }
  .card.s-IN_USE { border-left-color: var(--in-use); }
  .card.s-TO_CLEAN { border-left-color: var(--to-clean); }
  .card.s-CLEANING { border-left-color: var(--cleaning); }
  .card.s-INSPECTING { border-left-color: var(--inspecting); }
  .card.s-OPEN { border-left-color: var(--open); }
  .card h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
  .b-IN_USE { background: rgba(255,122,89,.18); color: var(--in-use); }
  .b-TO_CLEAN { background: rgba(245,185,66,.18); color: var(--to-clean); }
  .b-CLEANING { background: rgba(66,165,245,.18); color: var(--cleaning); }
  .b-INSPECTING { background: rgba(171,125,247,.18); color: var(--inspecting); }
  .b-OPEN { background: rgba(55,201,120,.18); color: var(--open); }
  .meta { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  .meta b { color: var(--text); font-weight: 600; }
  .timer { font-variant-numeric: tabular-nums; }
  .timer.overdue { color: var(--warn); font-weight: 700; }
  .timer.critical { color: var(--danger); font-weight: 700; }
  .card.has-alert { box-shadow: 0 0 0 1px rgba(255,77,109,.5); }
  .actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: auto; }
  .actions button { font-size: 12.5px; padding: 6px 10px; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .panel h2 { font-size: 14px; margin-bottom: 10px; color: var(--muted); letter-spacing: .5px; }
  .feed { display: flex; flex-direction: column; gap: 0; max-height: 62vh; overflow-y: auto; }
  .feed .item { padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
  .feed .item:last-child { border-bottom: 0; }
  .feed .row1 { display: flex; justify-content: space-between; gap: 8px; }
  .feed .who { font-weight: 600; }
  .feed .t { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .feed .row2 { color: var(--muted); margin-top: 2px; }
  .feed .reason { color: #ffb4b4; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  /* modal */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; z-index: 50;
  }
  .modal-mask.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: 420px; max-width: 92vw; padding: 20px; }
  .modal h3 { margin-bottom: 12px; }
  .modal p { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .modal textarea { width: 100%; min-height: 88px; resize: vertical; }
  .modal .btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  /* history modal */
  .history { width: 720px; max-height: 84vh; overflow-y: auto; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 6px; }
  .filters select, .filters input { font-size: 12.5px; padding: 6px 8px; }
  .filters .flabel { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .filters .flabel input { width: 155px; }
  .filter-summary { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
  .filter-summary b { color: var(--text); }
  .pager { text-align: center; margin: 10px 0 4px; }
  .pager button { font-size: 12.5px; }
  .history-section { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .history-section h4 { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .alert-history { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .alert-history .ah-item { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; }
  .alert-history .ah-row1 { display: flex; gap: 8px; }
  .alert-history .ah-note { color: #b8d8ff; }
  .alert-history .ah-muted { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
  /* toasts */
  #toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
  .toast {
    padding: 11px 16px; border-radius: 10px; background: var(--panel2);
    border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.4); font-size: 13px;
    animation: slide .2s ease; max-width: 340px;
  }
  .toast.error { border-color: var(--danger); }
  .toast.warn { border-color: var(--warn); }
  .toast.ok { border-color: var(--open); }
  @keyframes slide { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<header>
  <h1>🎤 mac-001 · KTV 包厢状态看板</h1>
  <span class="legend">
    <span><i style="background:var(--in-use)"></i>使用中</span>
    <span><i style="background:var(--to-clean)"></i>待清洁</span>
    <span><i style="background:var(--cleaning)"></i>清洁中</span>
    <span><i style="background:var(--inspecting)"></i>检查中</span>
    <span><i style="background:var(--open)"></i>可开放</span>
  </span>
  <div class="identity">
    <span class="conn"><span id="connDot" class="dot"></span><span id="connText">实时连接中</span></span>
    <select id="role">
      <option value="FRONT">前台</option>
      <option value="CLEANER">保洁</option>
      <option value="MANAGER">值班经理</option>
    </select>
    <input id="userName" placeholder="姓名" style="width:110px">
  </div>
</header>

<div class="layout">
  <main>
    <div id="alerts" class="alerts"></div>
    <div id="grid" class="grid"></div>
  </main>
  <aside class="side">
    <div class="panel">
      <h2>交接动态（实时）</h2>
      <div id="feed" class="feed"></div>
    </div>
  </aside>
</div>

<!-- 原因填写弹窗 -->
<div id="reasonModal" class="modal-mask">
  <div class="modal">
    <h3 id="reasonTitle"></h3>
    <p id="reasonHint"></p>
    <textarea id="reasonInput" placeholder="请填写原因（将记入交接记录，必填）"></textarea>
    <div class="btns">
      <button class="ghost" onclick="closeReason()">取消</button>
      <button class="primary danger" id="reasonConfirm">确认提交</button>
    </div>
  </div>
</div>

<!-- 交接记录弹窗 -->
<div id="historyModal" class="modal-mask">
  <div class="modal history">
    <h3 id="historyTitle"></h3>
    <div class="filters">
      <select id="fAction">
        <option value="">全部动作</option>
        <option value="CHECK_IN">开房</option>
        <option value="CHECK_OUT">退房</option>
        <option value="CLAIM">接单清洁</option>
        <option value="RELEASE_CLAIM">放弃接单</option>
        <option value="SUBMIT_CLEAN">清洁报检</option>
        <option value="PASS_INSPECTION">检查通过</option>
        <option value="REJECT_INSPECTION">检查不通过</option>
        <option value="ROLLBACK">异常退回</option>
      </select>
      <input id="fOperator" placeholder="操作人姓名（模糊）" style="width:150px">
      <label class="flabel">起 <input type="datetime-local" id="fFrom"></label>
      <label class="flabel">止 <input type="datetime-local" id="fTo"></label>
      <button class="primary" id="fSearch">查询</button>
      <button class="ghost" id="fReset">重置</button>
    </div>
    <div id="fSummary" class="filter-summary"></div>
    <table>
      <thead><tr><th>时间</th><th>动作</th><th>流转</th><th>操作人</th><th>交接责任人</th><th>原因</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
    <div id="historyPager" class="pager"></div>
    <div class="history-section">
      <h4>该包厢预警处理记录</h4>
      <div id="alertHistoryBody" class="alert-history">暂无记录</div>
    </div>
    <div class="btns"><button class="ghost" onclick="document.getElementById('historyModal').classList.remove('show')">关闭</button></div>
  </div>
</div>

<!-- 预警确认弹窗 -->
<div id="ackModal" class="modal-mask">
  <div class="modal">
    <h3>确认处理预警</h3>
    <p id="ackHint"></p>
    <textarea id="ackInput" placeholder="请填写处理备注（如已联系保洁加急、现场跟进情况，将随预警留痕，必填）"></textarea>
    <div class="btns">
      <button class="ghost" onclick="closeAck()">取消</button>
      <button class="primary" id="ackConfirm">确认并标记处理中</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
const ACTIONS_NEED_REASON = new Set(['REJECT_INSPECTION', 'ROLLBACK']);
const ACTION_BTN_CLASS = {
  CHECK_IN: 'primary', PASS_INSPECTION: 'primary',
  REJECT_INSPECTION: 'danger', ROLLBACK: 'danger',
};

let state = null;
const feedItems = [];
const FEED_KEEP = 100; // 本地动态保留上限（服务端单次下发上限更低，防止长期运行无限堆积）

// 合并服务端下发的事件（正序/倒序均可）：按事件 id 去重、按事件时间倒序、截断上限
function mergeFeed(events) {
  if (!events || !events.length) return;
  const known = new Set(feedItems.map(e => e.id));
  for (const ev of events) {
    if (!ev?.id || known.has(ev.id)) continue;
    known.add(ev.id);
    feedItems.push(ev);
  }
  feedItems.sort((a, b) => {
    if (a.at !== b.at) return a.at < b.at ? 1 : -1; // 新的在前
    return (b.version - a.version) || (a.id < b.id ? 1 : -1);
  });
  if (feedItems.length > FEED_KEEP) feedItems.length = FEED_KEEP;
}

// ---- 身份（演示：直接由前端设置；生产由服务端会话解析）----
const PRESET_NAME = { FRONT: '前台-小林', CLEANER: '保洁-王姐', MANAGER: '值班经理-老赵' };
const roleEl = document.getElementById('role');
const nameEl = document.getElementById('userName');
roleEl.value = localStorage.getItem('role') || 'FRONT';
nameEl.value = localStorage.getItem('userName') || PRESET_NAME[roleEl.value];
roleEl.onchange = () => { nameEl.value = PRESET_NAME[roleEl.value]; saveIdentity(); render(); };
nameEl.onchange = saveIdentity;
function saveIdentity() {
  localStorage.setItem('role', roleEl.value);
  localStorage.setItem('userName', nameEl.value.trim() || PRESET_NAME[roleEl.value]);
}
function currentOperatorName() {
  const role = roleEl.value;
  return nameEl.value.trim() || PRESET_NAME[role];
}
// 浏览器 fetch 头只接受 Latin-1（ByteString），中文名必须 percent-encode，
// 否则构造请求即抛 Cannot convert argument to a ByteString，请求无法发出；服务端会解码
function operator() {
  const role = roleEl.value;
  const name = currentOperatorName();
  return {
    'X-Role': role,
    'X-User-Name': encodeURIComponent(name),
    'X-User-Id': encodeURIComponent(`${role}:${name}`),
  };
}
// 本地比较用的未编码操作人 id（服务端事件中的 operatorId 是解码后的值）
function currentOperatorId() {
  return `${roleEl.value}:${currentOperatorName()}`;
}

// ---- 拉取 / 推送 ----
async function fetchSnapshot() {
  const res = await fetch('/api/rooms');
  state = await res.json();
  render();
}

function connectSSE() {
  const es = new EventSource('/api/events');
  es.addEventListener('hello', (e) => {
    // 首次打开：加载最近一段全局动态；断线重连：补齐断线期间的事件（服务端按 Last-Event-ID 增量返回）
    const data = JSON.parse(e.data);
    state = data.snapshot;
    mergeFeed(data.feed);
    setConn(true);
    render();
  });
  es.addEventListener('transition', (e) => {
    const { event, room } = JSON.parse(e.data);
    mergeFeed([event]);
    fetchSnapshot();
    if (event.operatorId !== currentOperatorId()) {
      toast(`「${room.name}」被 ${event.operatorName} 更新：${stateLabel(event.toState)}`, 'ok');
    }
  });
  es.addEventListener('alerts', (e) => {
    // 预警确认/解除/升级通过现有 SSE 实时同步
    const data = JSON.parse(e.data);
    state = state || {};
    state.alerts = data.snapshot || [];
    renderAlerts();
    // 交接记录弹窗打开时，同步刷新其预警处理记录区（按包厢校验，切包厢后的过期响应丢弃）
    if (hist && document.getElementById('historyModal').classList.contains('show')) {
      renderAlertHistory(hist.roomId);
    }
  });
  es.onopen = () => setConn(true);
  es.onerror = () => { setConn(false); setTimeout(() => { es.close(); connectSSE(); }, 3000); };
}
function setConn(ok) {
  document.getElementById('connDot').classList.toggle('off', !ok);
  document.getElementById('connText').textContent = ok ? '实时连接中' : '连接断开，重连中…';
}

// ---- 渲染 ----
function fmtClock(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}
function elapsed(iso) {
  return Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
}
function fmtDur(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}h${m}m` : m ? `${m}m${s}s` : `${s}s`;
}
function roomAlert(roomId) {
  return (state?.alerts || []).find(a => a.roomId === roomId);
}
function timerClass(room, al) {
  if (!state.sla[room.state] || !room.since) return '';
  if (al) return al.level === 'CRITICAL' ? 'critical' : 'overdue';
  const e = elapsed(room.since);
  if (e >= state.sla[room.state] * 2) return 'critical';
  if (e >= state.sla[room.state]) return 'overdue';
  return '';
}

function render() {
  if (!state) return;
  renderAlerts();
  const grid = document.getElementById('grid');
  const role = roleEl.value;
  grid.innerHTML = '';
  for (const room of state.rooms) {
    const al = roomAlert(room.id);
    const card = document.createElement('div');
    card.className = `card s-${room.state}${al ? ' has-alert' : ''}`;
    const actions = room.allowedByRole[role] || [];
    const sla = state.sla[room.state];
    card.innerHTML = `
      <h3>${room.name}
        <span class="badge b-${room.state}">${room.stateLabel}</span>
        <span style="margin-left:auto;font-size:11px;color:var(--muted)">v${room.version}</span>
      </h3>
      <div class="meta">
        <span>当前责任人：<b>${room.responsible?.name || '—'}</b></span>
        <span>进入状态：${room.since ? fmtClock(room.since) : '—'}</span>
        <span>停留：<span class="timer ${timerClass(room, al)}" data-since="${room.since || ''}" data-sla="${sla || ''}">
          ${room.since ? fmtDur(elapsed(room.since)) : ''}
        </span>${sla ? `（时限 ${fmtDur(sla)}）` : ''}</span>
      </div>
      <div class="actions">
        ${actions.map(a => `<button class="${ACTION_BTN_CLASS[a] || ''}" data-action="${a}">${actionLabel(a)}</button>`).join('')}
        <button class="ghost" data-history>交接记录</button>
      </div>`;
    card.querySelectorAll('[data-action]').forEach(btn => {
      btn.onclick = () => doAction(room, btn.dataset.action);
    });
    card.querySelector('[data-history]').onclick = () => showHistory(room);
    grid.appendChild(card);
  }
  renderFeed();
}

function actionLabel(a) {
  return {
    CHECK_IN: '开房', CHECK_OUT: '退房', CLAIM: '接单清洁', RELEASE_CLAIM: '放弃接单',
    SUBMIT_CLEAN: '清洁报检', PASS_INSPECTION: '检查通过', REJECT_INSPECTION: '检查不通过',
    ROLLBACK: '异常退回',
  }[a];
}

function renderAlerts() {
  const box = document.getElementById('alerts');
  const alerts = (state.alerts || []).slice().sort((a, b) =>
    (a.level === 'CRITICAL' ? 0 : 1) - (b.level === 'CRITICAL' ? 0 : 1));
  if (!alerts.length) { box.innerHTML = ''; return; }
  const isManager = roleEl.value === 'MANAGER';
  box.innerHTML = alerts.map(a => {
    const acked = a.status === 'ACKNOWLEDGED';
    return `
    <div class="alert ${a.level === 'CRITICAL' ? 'critical' : ''} ${acked ? 'ack' : ''}">
      <span class="tag">${a.level === 'CRITICAL' ? '⛔ 严重超时' : '⚠️ 超时提醒'}</span>
      <span class="astatus">${a.statusLabel || (acked ? '处理中' : '待处理')}</span>
      <span><b>${a.roomName}</b> ${stateLabel(a.state)} 已超时 <b>${fmtDur(a.overdueSec)}</b>
        （时限 ${fmtDur(a.limitSec)}），责任人：${a.responsible?.name || '—'}</span>
      <span class="time">${fmtClock(a.raisedAt)} 触发</span>
      ${isManager && !acked ? `<button class="primary ackbtn" data-ack="${a.key}">确认处理</button>` : ''}
      ${acked ? `<span class="note">🧰 ${escapeHtml(a.acknowledgedByName || '')} 已确认（${fmtClock(a.acknowledgedAt)}）：${escapeHtml(a.note || '')}</span>` : ''}
    </div>`;
  }).join('');
  box.querySelectorAll('[data-ack]').forEach(btn => {
    btn.onclick = () => openAck(btn.dataset.ack);
  });
}

// ---- 预警确认（仅经理）----
let ackKey = null;
function openAck(key) {
  const alert = (state.alerts || []).find(a => a.key === key);
  if (!alert) return;
  ackKey = key;
  document.getElementById('ackHint').textContent =
    `${alert.roomName} · ${stateLabel(alert.state)}超时 ${fmtDur(alert.overdueSec)}，确认后该预警标记为“处理中”并同步给所有看板。`;
  document.getElementById('ackInput').value = '';
  document.getElementById('ackModal').classList.add('show');
  document.getElementById('ackInput').focus();
}
function closeAck() { ackKey = null; document.getElementById('ackModal').classList.remove('show'); }
document.getElementById('ackConfirm').onclick = async () => {
  const note = document.getElementById('ackInput').value.trim();
  if (!note) return toast('请填写处理备注', 'warn');
  const key = ackKey; closeAck();
  try {
    const res = await fetch(`/api/alerts/${encodeURIComponent(key)}/ack`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...operator() },
      body: JSON.stringify({ note }),
    });
    const body = await res.json();
    if (!res.ok) return toast(body.error || '确认失败', 'error');
    toast('已标记处理中并同步', 'ok');
    await fetchSnapshot();
  } catch (e) { toast('网络错误：' + e.message, 'error'); }
};
function stateLabel(s) {
  return { IN_USE: '使用中', TO_CLEAN: '待清洁', CLEANING: '清洁中', INSPECTING: '检查中', OPEN: '可开放' }[s];
}

function renderFeed() {
  const box = document.getElementById('feed');
  if (!feedItems.length) { box.innerHTML = '<div style="color:var(--muted);font-size:12.5px">暂无动态，操作后将在此显示</div>'; return; }
  box.innerHTML = feedItems.slice(0, 30).map(ev => `
    <div class="item">
      <div class="row1">
        <span class="who">${ev.operatorName}（${roleLabel(ev.operatorRole)}）→ ${ev.toResponsible}</span>
        <span class="t">${fmtClock(ev.at)}</span>
      </div>
      <div class="row2">
        ${roomName(ev.roomId)} · ${actionLabel(ev.action)}
        ${ev.fromState ? `${stateLabel(ev.fromState)} → ` : ''}${stateLabel(ev.toState)}
        ${ev.reason ? ` · <span class="reason">原因：${escapeHtml(ev.reason)}</span>` : ''}
        ${ev.idempotencyKey && ev.idempotencyKey.startsWith('idem-retry') ? ' · 重试命中' : ''}
      </div>
    </div>`).join('');
}
function roleLabel(r) { return { FRONT: '前台', CLEANER: '保洁', MANAGER: '值班经理' }[r] || r; }
function roomName(id) { return state?.rooms?.find(r => r.id === id)?.name || id; }
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ---- 操作 ----
let pending = null;
function doAction(room, action) {
  const exec = (reason) => postTransition(room, action, reason);
  if (ACTIONS_NEED_REASON.has(action)) {
    pending = { room, action };
    document.getElementById('reasonTitle').textContent =
      `${actionLabel(action)}：${room.name}（v${room.version} → v${room.version + 1}）`;
    document.getElementById('reasonHint').textContent =
      action === 'ROLLBACK'
        ? `当前「${room.stateLabel}」将退回到上一状态，并恢复原责任人。该操作仅值班经理可用，会永久留痕。`
        : '检查不通过将退回原保洁返工，请说明不通过原因。';
    document.getElementById('reasonInput').value = '';
    document.getElementById('reasonModal').classList.add('show');
    document.getElementById('reasonInput').focus();
  } else {
    exec(null);
  }
}
document.getElementById('reasonConfirm').onclick = async () => {
  const reason = document.getElementById('reasonInput').value.trim();
  if (!reason) return toast('请填写原因', 'warn');
  const p = pending; pending = null;
  document.getElementById('reasonModal').classList.remove('show');
  if (p) await postTransition(p.room, p.action, reason);
};
function closeReason() { pending = null; document.getElementById('reasonModal').classList.remove('show'); }

async function postTransition(room, action, reason) {
  const idem = 'idem-' + Math.random().toString(36).slice(2, 10);
  try {
    const res = await fetch(`/api/rooms/${room.id}/transitions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...operator(), 'Idempotency-Key': idem },
      body: JSON.stringify({ action, expectedVersion: room.version, reason, idempotencyKey: idem }),
    });
    const body = await res.json();
    if (!res.ok) {
      if (body.code === 'VERSION_CONFLICT') {
        toast(`⛔ ${body.error}`, 'error');
        await fetchSnapshot();
      } else {
        toast(body.error || '操作失败', 'error');
      }
      return;
    }
    toast(body.duplicated ? '重复请求已幂等处理' : '操作成功', 'ok');
    await fetchSnapshot();
  } catch (e) {
    toast('网络错误：' + e.message, 'error');
  }
}

// ---- 交接记录：筛选 + 稳定游标分页 ----
const PAGE_SIZE = 20;
let hist = null; // { roomId, filters, events[], nextCursor, loading, totalMatched, gen }
let histGen = 0; // 查询代次：切包厢 / 新筛选递增，过期异步响应必须丢弃

function histFilters() {
  return {
    action: document.getElementById('fAction').value,
    operator: document.getElementById('fOperator').value.trim(),
    from: document.getElementById('fFrom').value,
    to: document.getElementById('fTo').value,
  };
}
function buildHistQueryUrl(roomId, f, cursor) {
  const q = new URLSearchParams({ limit: String(PAGE_SIZE) });
  if (cursor) q.set('cursor', cursor);
  if (f.action) q.set('action', f.action);
  if (f.operator) q.set('operator', f.operator);
  if (f.from) q.set('from', new Date(f.from).toISOString());
  if (f.to) q.set('to', new Date(f.to).toISOString());
  return `/api/rooms/${encodeURIComponent(roomId)}/history?${q}`;
}
// 响应返回时弹窗已切到别的包厢或更新了筛选代次，则该响应为过期结果，禁止写入
function isHistCurrent(gen, roomId) {
  return Boolean(hist) && hist.roomId === roomId && hist.gen === gen;
}
// 预警处理记录与筛选无关，只按包厢守卫（切包厢后的过期响应丢弃，搜索/翻页不影响）
function isAlertHistCurrent(roomId) {
  return Boolean(hist) && hist.roomId === roomId;
}
async function fetchHistPage({ gen, roomId, filters, cursor }) {
  const res = await fetch(buildHistQueryUrl(roomId, filters, cursor));
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '查询失败');
  return data;
}
function renderHistRows() {
  const body = document.getElementById('historyBody');
  if (!hist.events.length) {
    body.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">当前筛选条件下暂无记录</td></tr>';
  } else {
    body.innerHTML = hist.events.map(ev => `
      <tr>
        <td>${new Date(ev.at).toLocaleString('zh-CN', { hour12: false })}</td>
        <td>${ev.actionLabel}</td>
        <td>${ev.fromStateLabel ? ev.fromStateLabel + ' → ' : ''}${ev.toStateLabel}<br>
          <span style="color:var(--muted)">v${ev.version}</span></td>
        <td>${ev.operatorName}<br><span style="color:var(--muted)">${ev.operatorRoleLabel}</span></td>
        <td>${ev.toResponsible}</td>
        <td class="reason">${ev.reason ? escapeHtml(ev.reason) : '—'}</td>
      </tr>`).join('');
  }
  const f = hist.filters;
  const chips = [];
  if (f.action) chips.push(`动作=<b>${actionLabel(f.action)}</b>`);
  if (f.operator) chips.push(`操作人含=<b>${escapeHtml(f.operator)}</b>`);
  if (f.from) chips.push(`起=<b>${f.from.replace('T', ' ')}</b>`);
  if (f.to) chips.push(`止=<b>${f.to.replace('T', ' ')}</b>`);
  document.getElementById('fSummary').innerHTML =
    `已加载 <b>${hist.events.length}</b> / 命中 <b>${hist.totalMatched}</b> 条` +
    (chips.length ? `　筛选：${chips.join('，')}` : '　（全部记录）');
  const pager = document.getElementById('historyPager');
  pager.innerHTML = hist.nextCursor
    ? `<button class="primary" id="loadMoreHist" ${hist.loading ? 'disabled' : ''}>${hist.loading ? '加载中…' : '加载更早记录'}</button>`
    : (hist.events.length ? '<span style="color:var(--muted);font-size:12px">— 已到最早记录 —</span>' : '');
  if (hist.nextCursor) document.getElementById('loadMoreHist').onclick = loadMoreHist;
}
async function loadMoreHist() {
  if (!hist || hist.loading || !hist.nextCursor) return;
  const gen = hist.gen;
  const roomId = hist.roomId;
  const cursor = hist.nextCursor; // 捕获游标，过期响应不得改它
  const filters = hist.filters;
  hist.loading = true;
  renderHistRows();
  try {
    const data = await fetchHistPage({ gen, roomId, filters, cursor });
    // 切包厢 / 新筛选后此响应已过期：只丢弃，不改任何弹窗状态
    if (!isHistCurrent(gen, roomId)) return;
    const known = new Set(hist.events.map(e => e.id));
    for (const ev of data.events) if (!known.has(ev.id)) { known.add(ev.id); hist.events.push(ev); }
    hist.nextCursor = data.nextCursor;
    hist.totalMatched = data.totalMatched;
  } catch (e) {
    if (isHistCurrent(gen, roomId)) toast(e.message, 'error');
  } finally {
    if (isHistCurrent(gen, roomId)) { hist.loading = false; renderHistRows(); }
  }
}
async function runHistSearch(resetPager) {
  // 新查询（切包厢/点查询）开新代次；翻页延续当前代次
  if (resetPager) {
    hist.filters = histFilters();
    hist.nextCursor = null;
    hist.events = [];
    hist.gen = ++histGen;
  }
  const gen = hist.gen;
  const roomId = hist.roomId;
  const filters = hist.filters;
  const cursor = hist.nextCursor;
  hist.loading = true;
  renderHistRows();
  try {
    const data = await fetchHistPage({ gen, roomId, filters, cursor });
    if (!isHistCurrent(gen, roomId)) return;
    const known = new Set(hist.events.map(ev => ev.id));
    for (const ev of data.events) if (!known.has(ev.id)) { known.add(ev.id); hist.events.push(ev); }
    hist.nextCursor = data.nextCursor;
    hist.totalMatched = data.totalMatched;
  } catch (e) {
    if (isHistCurrent(gen, roomId)) toast(e.message, 'error');
  } finally {
    if (isHistCurrent(gen, roomId)) { hist.loading = false; renderHistRows(); }
  }
}
async function renderAlertHistory(roomId) {
  const box = document.getElementById('alertHistoryBody');
  box.textContent = '加载中…';
  try {
    const res = await fetch(`/api/alerts/history?roomId=${encodeURIComponent(roomId)}&limit=50`);
    const data = await res.json();
    // 切包厢后的过期响应不得写入当前弹窗（搜索/翻页与本区无关）
    if (!isAlertHistCurrent(roomId)) return;
    if (!data.alerts.length) { box.textContent = '暂无记录'; return; }
    box.innerHTML = data.alerts.map(a => `
      <div class="ah-item">
        <div class="ah-row1">
          <span class="astatus">${a.statusLabel || '已解除'}</span>
          <b>${stateLabel(a.state)}超时</b>
          <span class="ah-muted">${new Date(a.raisedAt).toLocaleString('zh-CN', { hour12: false })} 触发
            → ${new Date(a.resolvedAt).toLocaleString('zh-CN', { hour12: false })} 随状态流转解除</span>
        </div>
        ${a.acknowledgedByName ? `<div class="ah-note">🧰 ${escapeHtml(a.acknowledgedByName)} 于 ${new Date(a.acknowledgedAt).toLocaleString('zh-CN', { hour12: false })} 确认：${escapeHtml(a.note || '')}</div>` : '<div class="ah-muted">解除前未经经理确认</div>'}
      </div>`).join('');
  } catch { if (isAlertHistCurrent(roomId)) box.textContent = '加载失败'; }
}

async function showHistory(room) {
  document.getElementById('historyTitle').textContent = `${room.name} · 交接记录`;
  const gen = ++histGen; // 切包厢开新代次，使上一包厢在途响应失效
  hist = { roomId: room.id, filters: histFilters(), events: [], nextCursor: null, loading: false, totalMatched: 0, gen };
  document.getElementById('historyBody').innerHTML = '';
  document.getElementById('alertHistoryBody').textContent = '加载中…';
  document.getElementById('historyPager').innerHTML = '';
  document.getElementById('fSummary').textContent = '';
  document.getElementById('historyModal').classList.add('show');
  await Promise.all([runHistSearch(false), renderAlertHistory(room.id)]);
}
document.getElementById('fSearch').onclick = () => runHistSearch(true);
document.getElementById('fReset').onclick = () => {
  document.getElementById('fAction').value = '';
  document.getElementById('fOperator').value = '';
  document.getElementById('fFrom').value = '';
  document.getElementById('fTo').value = '';
  runHistSearch(true);
};

// ---- toast ----
function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 3600);
}

// 倒计时每秒刷新（纯前端展示，不改变状态）
setInterval(() => {
  document.querySelectorAll('.timer[data-since]').forEach(el => {
    const since = el.dataset.since;
    if (since) el.textContent = fmtDur(elapsed(since));
  });
}, 1000);

saveIdentity();
fetchSnapshot();
connectSSE();
</script>
